events {}

http {
    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    server {
        listen 8000;

        # 🚀 Netflix-Style Dynamic Routing
        # Pattern: /api/{version}/{service}/{path}
        location ~ ^/api/(?<version>v[0-9]+)/(?<service>[^/]+)/(?<rest>.*)$ {
            # ---------------- CORS ----------------
            set $cors_origin "";
            if ($http_origin ~* (http://localhost:3000)$ ) {
                set $cors_origin $http_origin;
            }

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # ---------------- PROXY ----------------
            proxy_pass http://$service:8000/api/$version/$service/$rest;
            
            proxy_set_header X-API-Version $version;
            proxy_set_header X-Original-Service $service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root health check or fallback
        location /health {
            return 200 'Gateway is healthy';
            add_header Content-Type text/plain;
        }
    }
}