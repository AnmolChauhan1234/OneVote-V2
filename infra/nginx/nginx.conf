events {}

http {
    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    server {
        listen 8000;

        # 🚀 Netflix-Style Dynamic Routing
        # Pattern: /api/{version}/{service}/{path}
        location ~ ^/api/(?<version>v[0-9]+)/(?<service>[^/]+)/(?<rest>.*)$ {
            
            # 1. Dynamically resolve the internal container name
            # If the URL is /api/v1/auth/login, $service becomes "auth"
            # Nginx will automatically try to hit http://auth:8000/...
            proxy_pass http://$service:8000/api/$version/$service/$rest;

            # 2. Advanced: Version Headers
            proxy_set_header X-API-Version $version;
            proxy_set_header X-Original-Service $service;
            
            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root health check or fallback
        location /health {
            return 200 'Gateway is healthy';
            add_header Content-Type text/plain;
        }
    }
}