services:

  postgres:
    image: postgres:15
    container_name: onevote_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: onevote_redis
    ports:
      - "6379:6379"

  nginx:
    build: ./infra/nginx
    container_name: onevote_nginx
    ports:
      - "80:80"
    depends_on:
      - auth
      - identity
      - biometric
      - organisation
      - election
      - voting
      - notification

  auth:
    build: ./backend/services/auth
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DB}
    volumes:
      - ./backend/services/auth:/app      
      - ./backend/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    build: ./backend/services/identity
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${IDENTITY_DB}
    volumes:
      - ./backend/services/identity:/app
      - ./backend/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy

  biometric:
    build: ./backend/services/biometric
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${BIOMETRIC_DB}
    volumes:
      - ./backend/services/biometric:/app
      - ./backend/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy

  organisation:
    build: ./backend/services/organisation
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ORG_DB}
    volumes:
      - ./backend/services/organisation:/app
      - ./backend/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy

  election:
    build: ./backend/services/election
    ports:
      - "8005:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ELECTION_DB}
    volumes:
      - ./backend/services/election:/app
      - ./backend/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy

  voting:
    build: ./backend/services/voting
    ports:
      - "8006:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${VOTING_DB}
    volumes:
      - ./backend/services/voting:/app
      - ./backend/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy

  notification:
    build: ./backend/services/notification
    ports:
      - "8007:8000"
    env_file:
      - .env
    volumes:
      - ./backend/services/notification:/app
      - ./backend/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: